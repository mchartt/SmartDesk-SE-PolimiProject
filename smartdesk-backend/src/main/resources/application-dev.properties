# JWT locale (min 32 caratteri). Sovrascrivibile con SECURITY_ACCESS_TOKEN_SECRET in .env.
security.access-token-secret=${SECURITY_ACCESS_TOKEN_SECRET:QuestaEunaChiaveSuperSegretaMoltoLungaPerGarantireLaSicurezzaDeiToken123!}

# H2 2.x: non usare DB_CLOSE_ON_EXIT=FALSE insieme ad AUTO_SERVER=TRUE (JdbcSQLFeatureNotSupportedException 50100).
spring.datasource.url=jdbc:h2:file:./data/smartdesk;MODE=MySQL;AUTO_SERVER=TRUE;DATABASE_TO_UPPER=FALSE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/h2/legacy-booking-cleanup.sql
spring.h2.console.enabled=true

# Seeding configurations
# Default dev-only: sovrascrivibili via env (APP_SEED_ADMIN_*) o -Dapp.seed.admin.* sulla JVM.
app.seed.admin.email=${APP_SEED_ADMIN_EMAIL:admin@admin.com}
# NOTA PER IL DOCENTE: Il fallback 'Admin123!' e' una misura intenzionalmente semplificata per il dev locale.
# In produzione si devono usare esclusivamente le variabili d'ambiente.
app.seed.admin.password=${APP_SEED_ADMIN_PASSWORD:Admin123!}
app.seed.test-users.enabled=true

