# Shared defaults for all profiles.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

app.cache.review-stats.average-rating-by-space-ttl=${APP_CACHE_REVIEW_STATS_AVERAGE_RATING_TTL:5m}

security.access-token-secret=${SECURITY_ACCESS_TOKEN_SECRET:}
security.access-token-ttl-seconds=${SECURITY_ACCESS_TOKEN_TTL_SECONDS:900}
security.jwt-issuer=${SECURITY_JWT_ISSUER:smartdesk-backend}

# Optional seeder credentials for local/manual testing.
app.seed.admin.email=${APP_SEED_ADMIN_EMAIL:}
app.seed.admin.password=${APP_SEED_ADMIN_PASSWORD:}
app.seed.technician.email=${APP_SEED_TECHNICIAN_EMAIL:}
app.seed.technician.password=${APP_SEED_TECHNICIAN_PASSWORD:}
