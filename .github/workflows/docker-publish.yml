name: Docker Publish

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:
  backend:
    name: Backend build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smartdesk-backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Test
        run: chmod +x mvnw && ./mvnw test -q

      - name: Build JAR
        run: ./mvnw package -DskipTests -q

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smartdesk-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: smartdesk-frontend/package-lock.json

      - name: Install
        run: npm ci --quiet

      - name: Build
        run: npm run build

  publish:
    name: Publish Docker images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase Repository Owner
        run: echo "REPO_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./smartdesk-backend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.REPO_OWNER }}/smartdesk-backend:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./smartdesk-frontend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.REPO_OWNER }}/smartdesk-frontend:latest
