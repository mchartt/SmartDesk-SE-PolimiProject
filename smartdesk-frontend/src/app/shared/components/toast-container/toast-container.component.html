<div
  class="toast-container position-fixed bottom-0 end-0 p-3 p-md-4"
  style="z-index: 1080; padding-bottom: max(2rem, env(safe-area-inset-bottom)) !important;"
  aria-live="polite"
  aria-relevant="additions"
>
  @for (toast of toastService.toasts(); track toast.id) {
    <div
      class="toast show align-items-center border-0 mb-3"
      role="alert"
      aria-live="assertive"
      aria-atomic="true"
    >
      <div class="d-flex p-2">
        <div class="toast-body d-flex align-items-center gap-3 w-100">
          @if (toast.kind === 'success') {
            <div class="toast-icon-wrapper text-success">
              <app-sd-icon name="circle-check" [size]="24" />
            </div>
          } @else {
            <div class="toast-icon-wrapper text-danger">
              <app-sd-icon name="exclamation" [size]="24" />
            </div>
          }
          <span class="toast-message flex-grow-1 fw-medium">{{ toast.message }}</span>
          <button
            type="button"
            class="btn-close ms-2"
            aria-label="Chiudi notifica"
            (click)="toastService.dismiss(toast.id)"
            mdbRipple
          ></button>
        </div>
      </div>
    </div>
  }
</div>
